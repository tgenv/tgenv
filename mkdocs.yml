site_name: TGEnv
site_description: Terragrunt Version Manager
site_url: https://tgenv.github.io/tgenv/
repo_url: https://github.com/tgenv/tgenv
repo_name: tgenv/tgenv
edit_uri: edit/main/docs/

docs_dir: docs

theme:
  name: material
  logo: img/logo.png
  favicon: img/favicon.ico
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.action.edit

plugins:
  - search

nav:
  - Introduction: index.md
  - Installation: installation.md
  - Usage:
      - tgenv install: usage/install.md
      - tgenv use: usage/use.md
      - tgenv list: usage/list.md
      - tgenv list-remote: usage/list-remote.md
      - tgenv uninstall: usage/uninstall.md
      - tgenv upgrade: usage/upgrade.md
  - Terragrunt Version File: terragrunt-version-file.md
  - Environment Variables: environment-variables.md
  - Architecture: architecture.md
  - Uninstalling TGEnv: uninstalling.md
  - Contributing: contributing.md
